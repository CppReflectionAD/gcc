name: Compile GCC

on:
  push:
    branches: [ "master", "p4395", "p4395ci" ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
            platform: linux/arm64

    runs-on: ${{ matrix.runner }}
    outputs:
      short_sha: ${{ steps.merge_base.outputs.short_sha }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 100

      - name: Compute merge-base with remote p4395
        id: merge_base
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ github.repository }}" = "CppReflectionAD/gcc" ]; then
            GCC_REPO="https://x-access-token:${GH_TOKEN}@github.com/CppReflectionAD/gcc.git"
          else
            GCC_REPO="https://github.com/CppReflectionAD/gcc.git"
          fi
          git fetch --no-tags --depth=100 "$GCC_REPO" +refs/heads/p4395:refs/remotes/gcc/p4395
          sha="$(git merge-base HEAD gcc/p4395)"
          echo "Merge-base commit: $sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short_sha=${sha:0:7}" >> "$GITHUB_OUTPUT"

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache cmake ninja-build flex bison libgmp-dev libmpfr-dev libmpc-dev libisl-dev texinfo zlib1g-dev gperf dejagnu z3

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ matrix.arch }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.arch }}-

      - name: Configure GCC
        run: |
          ccache --set-config=max_size=4G
          ccache --set-config=compression=true
          ccache --set-config=hash_dir=false
          ccache --set-config=sloppiness=locale,time_macros
          ccache --zero-stats
          mkdir build
          cd build
          CC="ccache gcc" CXX="ccache g++" ../configure \
            --prefix=/opt/gcc \
            --enable-languages=c,c++ \
            --disable-bootstrap \
            --disable-multilib \
            --disable-nls \
            --with-isl

      - name: Build GCC
        run: |
          cd build
          make -j$(nproc)
          ccache --show-stats

      - name: Test Reflection
        run: |
          set -euo pipefail
          cd build/gcc
          make -j"$(nproc)" check-g++ RUNTESTFLAGS="dg.exp=reflect/*.C" || true
          sum=testsuite/g++/g++.sum
          if ! grep -q '^# of expected passes' "$sum"; then
            echo "::error::No reflection tests ran; see g++.log in the job's artifacts"
            exit 1
          fi
          grep '^# of ' "$sum"
          if grep -E '^(FAIL|XPASS|UNRESOLVED|ERROR):' "$sum"; then
            echo "::error::GCC's reflection tests failed; see g++.sum and g++.log in the job's artifacts"
            exit 1
          fi

      - name: Install into staging dir
        if: github.event_name != 'pull_request'
        run: |
          cd build
          make install-strip DESTDIR=$GITHUB_WORKSPACE/dist

      - name: Set up Docker Buildx
        if: github.event_name != 'pull_request'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        if: github.event_name != 'pull_request'
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            suffix=-${{ matrix.arch }}
          tags: |
            type=ref,event=branch
            type=raw,value=sha-${{ steps.merge_base.outputs.short_sha }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}

      - name: Build and push image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: dist
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  manifest:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    permissions:
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=raw,value=sha-${{ needs.build.outputs.short_sha }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}

      - name: Create and push multi-arch manifest
        run: |
          echo "${{ steps.meta.outputs.tags }}" | while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            docker buildx imagetools create -t "$tag" "${tag}-amd64" "${tag}-arm64"
          done
